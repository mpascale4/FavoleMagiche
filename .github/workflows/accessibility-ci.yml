name: Accessibility CI

permissions:
  contents: read

concurrency:
  group: accessibility-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and a11y tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Lighthouse accessibility gate
        run: npm run test:lighthouse

